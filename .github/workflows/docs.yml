name: Generate YARD Docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec yardoc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'doc'
      - uses: actions/deploy-pages@v4